{% extends 'base.html' %}

{% block title %}Задать вопрос{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-4 text-secondary fw-bold">Создать новый вопрос</h2>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            {{ form.errors }}
                        </div>
                    {% endif %}

                    <div class="mb-3 django-form-fields">
                        {{ form.as_p }}
                    </div>
                    
                    <hr>
                    <button type="submit" class="btn btn-success px-4">Опубликовать вопрос</button>
                    <a href="{% url 'index_page' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.django-form-fields input, .django-form-fields textarea').forEach(function(el) {
        el.classList.add('form-control');
        el.classList.add('mb-3');
    });
</script>
{% endblock %}
